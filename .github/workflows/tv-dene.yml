# Geçici deneme: TFF hakemleri ve TRT Spor / tabii yayın akışı (salt okunur)
name: TV dene
on:
  push:
    branches: [main]
    paths: [.github/workflows/tv-dene.yml, .github/arac/tv-dene.js]
  workflow_dispatch:
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/arac/tv-dene.js
