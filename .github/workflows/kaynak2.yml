name: Kaynak dene 2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/kaynak2.yml, .github/arac/kaynak2.js]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/arac/kaynak2.js > rapor2.txt 2>&1 || true
      - run: cat rapor2.txt
