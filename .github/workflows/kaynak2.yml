name: Kaynak dene 2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/kaynak2.yml, .github/arac/kaynak2.js]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        parca: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/arac/kaynak2.js || true
        env: { PARCA: '${{ matrix.parca }}', PARCA_SAY: '6' }
