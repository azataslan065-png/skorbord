# Skorbord verisi: kulüp bilgisi, kupalar, geçmiş sezonlar, oyuncu fotoğrafları (günde bir), ESPN'de olmayan liglerin maçları (30 dakikada bir).
# Sonuç veri/<lig>.json olarak depoya yazılır; uygulama bu dosyaları okur. Ayrıntı: .github/arac/veri-topla.js
# Tam toplama 8 paralel işe bölünür (her iş kendi liglerini toplar ve kaydeder): tek iş GitHub'ın 5 saat sınırına takılıyordu.
name: Veri topla
on:
  schedule:
    - cron: '23 2 * * *'        # her gün 05:23 (İstanbul): bütün veri
    - cron: '7,37 * * * *'      # her 30 dk: TheSportsDB liglerinin maçları (--hizli)
  workflow_dispatch:
    inputs:
      ligler: { description: 'Boşluklu lig listesi (boş = hepsi)', required: false, default: '' }
      hizli: { description: 'Yalnızca TheSportsDB maçları', required: false, default: 'hayir' }
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        grup: [0, 1, 2, 3, 4, 5, 6, 7]
    concurrency:
      group: veri-topla-${{ matrix.grup }}
      cancel-in-progress: false
    steps:
      - name: Hızlı kipte yalnızca bir iş
        id: k
        run: |
          H=""; if [ "${{ github.event.schedule }}" = "7,37 * * * *" ] || [ "${{ inputs.hizli }}" = "evet" ]; then H="--hizli"; fi
          echo "h=$H" >> $GITHUB_OUTPUT
          if { [ -n "$H" ] || [ -n "${{ inputs.ligler }}" ]; } && [ "${{ matrix.grup }}" != "0" ]; then echo "atla=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.k.outputs.atla != '1'
      - uses: actions/setup-node@v4
        if: steps.k.outputs.atla != '1'
        with: { node-version: 20 }
      - name: Topla
        if: steps.k.outputs.atla != '1'
        run: |
          if [ "${{ matrix.grup }}" = "0" ] && [ -z "${{ steps.k.outputs.h }}" ]; then npm i --no-save --silent --prefix .github/arac sharp@0.33.5 || true; fi
          G="--grup=${{ matrix.grup }}/8"; if [ -n "${{ steps.k.outputs.h }}" ] || [ -n "${{ inputs.ligler }}" ]; then G=""; fi
          node .github/arac/veri-topla.js ${{ steps.k.outputs.h }} $G ${{ inputs.ligler }}
      - name: Kaydet
        if: steps.k.outputs.atla != '1'
        run: |
          git config user.name github-actions && git config user.email actions@github.com
          git add veri && (git diff --cached --quiet || (git commit -qm "Veri $(date -u +%FT%TZ) grup ${{ matrix.grup }}" && for i in 1 2 3 4 5 6; do git pull -q --rebase && git push -q && break; sleep $((RANDOM % 10 + 5)); done))
