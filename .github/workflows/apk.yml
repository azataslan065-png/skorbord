# Skorbord APK'sı. Sayfa ya da kabuk (android/) değişince veya elle derlenir; APK "apk" sürümüne yüklenir.
name: APK
on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/apk.yml, index.html, yerel-vt.js, gercek.js, manifest.json, app-icon-192.png, app-icon-512.png, ortak/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Derle
        working-directory: android
        run: gradle assembleRelease --no-daemon --console=plain
      - name: Yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/Skorbord.apk
          # Güncelleme bilgisi (bkz. android Guncelle): "skorbord" alanı yeni sistem, üst düzey kod eski (derleme 6-7) kabuk için.
          BOY=$(stat -c %s out/Skorbord.apk); NOT=$(git log -1 --pretty=%s | tr -d '"\\' | cut -c1-160)
          URL="https://github.com/${{ github.repository }}/releases/download/apk/Skorbord.apk"
          printf '{"kod":%s,"ad":"1.0.%s","skorbord":{"kod":%s,"ad":"1.0.%s","url":"%s","boyut":%s,"tarih":%s,"not":"%s"}}' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$URL" "$BOY" "$(date +%s%3N)" "$NOT" > out/surum.json
          cat out/surum.json
          ls -la out
          gh release delete apk -y --cleanup-tag 2>/dev/null || true
          gh release create apk out/Skorbord.apk out/surum.json --title "Skorbord APK (derleme $GITHUB_RUN_NUMBER)" --notes "Telefona indirip kur; yeni sürüm eskisinin üstüne kurulur." --latest
