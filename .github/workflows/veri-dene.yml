name: Veri dene
on:
  push:
    branches: [main]
    paths: [.github/workflows/veri-dene.yml, .github/teshis/**]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/teshis/veri.sh
      - run: |
          cd out && git init -q -b teshis && git add -A && git -c user.name=t -c user.email=t@users.noreply.github.com commit -qm t && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" teshis
