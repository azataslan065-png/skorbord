plugins { id 'com.android.application' }
// Sayfa ve ikonlar APK'ya gömülür (bkz. Ana.ver): uygulama, site yayında olmasa da kendi kopyasından açılır.
def SITE = ['canli-skor.html', 'canli-skor.webmanifest', 'canli-skor-192.png', 'canli-skor-512.png']
def hedef = file('build/site'); hedef.mkdirs()
SITE.each { ad -> new File(hedef, ad).bytes = file("../../${ad}").bytes }
def NO = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
android {
    namespace 'com.azat.skorbord'
    compileSdk 35
    defaultConfig {
        applicationId 'com.azat.skorbord'
        minSdk 24
        targetSdk 34
        versionCode NO
        versionName '1.0.' + NO
        resValue 'string', 'app_name', 'Skorbord'
    }
    signingConfigs {
        imza {
            // Anahtar depoda durur: her derleme aynı imzayı taşır, yeni APK eskisinin üstüne kurulur.
            storeFile file('../skorbord.jks')
            storePassword 'skorbord'
            keyAlias 'skorbord'
            keyPassword 'skorbord'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.imza } }
    sourceSets { main.assets.srcDirs = ['build/site'] }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
